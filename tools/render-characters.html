<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>bärly Maskottchen-Renderer</title>
<!-- Rendert die Maskottchen aus mascots.js: node tools/render.js tools/render-characters.html assets/characters -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap">
<style>
  body { margin: 0; background: transparent; display: flex; flex-wrap: wrap; align-items: flex-start; }
  .shot { width: 940px; }
  .shot.bust { width: 600px; }
  .shot svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<script src="../brand.js"></script>
<script src="../mascots.js"></script>
<script>
  const ids = ['glow', 'flex', 'snoozy', 'daily'];
  document.body.innerHTML = ids.map(id => `<div class="shot" id="${id}">${Baerly.mascot(id)}</div>`).join('') +
    ids.map(id => `<div class="shot bust" id="${id}-bust">${Baerly.mascot(id, { pose: 'bust' })}</div>`).join('');
</script>
</body>
</html>
