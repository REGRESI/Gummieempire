<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>bärly Produkt-Renderer</title>
<!-- Rendert die Launch-Dosen aus packs.js als einzelne Produktbilder (siehe tools/render-products.js) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Figtree:wght@500;600;700;800&display=swap">
<style>
  body { margin: 0; background: transparent; }
  .shot { width: 720px; }
  .shot svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div id="out"></div>
<script src="../brand.js"></script>
<script src="../packs.js"></script>
<script>
  const { PRODUCTS, packs } = window.Baerly;
  // Gemeinsame Leinwand: so hoch wie die Dose Groß, damit alle Bilder denselben Maßstab haben
  const MM = 188 / 70;
  const canvasH = Math.ceil(66 + 150 * MM + 22);
  document.getElementById('out').innerHTML = PRODUCTS.filter(p => p.launch)
    .map(p => `<div class="shot" id="shot-${p.id}">${packs.jar(p, { canvasH })}</div>`).join('');
</script>
</body>
</html>
