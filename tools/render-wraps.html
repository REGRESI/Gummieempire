<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>bärly Dosen-Abwicklung</title>
<!-- Rendert die Etiketten-Abwicklung für die 360°-Ansicht: node tools/render.js tools/render-wraps.html assets/products -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Figtree:wght@500;600;700;800&display=swap">
<style>
  body { margin: 0; background: transparent; }
  .shot { width: 2000px; }
  .shot svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div id="out"></div>
<script src="../brand.js"></script>
<script src="../mascots.js"></script>
<script src="../packs.js"></script>
<script>
  const { PRODUCTS, PDP, packs, mascot } = window.Baerly;
  document.getElementById('out').innerHTML = PRODUCTS.filter(p => p.launch).map(p =>
    `<div class="shot" id="${p.id}-wrap">${packs.jarWrap(p, {
      mascot: mascot(p.id, { pose: 'bust', label: false }),
      role: PDP[p.id].traits[0][1],
      line: PDP[p.id].lines[0]
    })}</div>`).join('');
</script>
</body>
</html>
